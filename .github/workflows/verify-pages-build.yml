name: Verify Pages Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify-base-path:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for GitHub Pages
        run: pnpm build:pages

      - name: Verify dist/index.html exists
        run: |
          if [ ! -f dist/index.html ]; then
            echo "::error::dist/index.html was not generated by the build."
            exit 1
          fi

      - name: Verify asset paths match the configured base path
        run: |
          node <<'EOF'
          const fs = require("fs");
          const path = require("path");

          const viteConfigPath = path.join(process.cwd(), "vite.config.ts");
          const viteConfigSrc = fs.readFileSync(viteConfigPath, "utf8");

          const baseMatch = viteConfigSrc.match(/base\s*:\s*["'`]([^"'`]+)["'`]/);
          const base = baseMatch ? baseMatch[1] : "/";

          console.log(`Detected Vite base path: "${base}"`);

          const indexHtml = fs.readFileSync(
            path.join(process.cwd(), "dist", "index.html"),
            "utf8"
          );

          const assetRefs = [
            ...indexHtml.matchAll(/(?:src|href)="([^"]+)"/g),
          ].map((m) => m[1]);

          const localAssetRefs = assetRefs.filter(
            (ref) => !/^https?:\/\//.test(ref) && !ref.startsWith("data:")
          );

          const badRefs = localAssetRefs.filter(
            (ref) => base !== "/" && !ref.startsWith(base) && !ref.startsWith("//")
          );

          if (badRefs.length > 0) {
            console.error(
              `::error::Found ${badRefs.length} asset reference(s) in dist/index.html ` +
                `that do not start with the configured base path "${base}":\n` +
                badRefs.map((r) => `  - ${r}`).join("\n")
            );
            process.exit(1);
          }

          console.log(
            `All ${localAssetRefs.length} local asset reference(s) correctly use base path "${base}".`
          );
          EOF

      - name: Upload build output (on failure, for debugging)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dist-debug
          path: dist
